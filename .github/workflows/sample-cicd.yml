name: CI-CD sample for Addin build

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  Artifact-Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Lint codebase
        run: npm run lint

      - name: Validate manifest
        run: npm run validate

      - name: Build production artifacts
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: office-addin-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
        
  Deploy-on-Server:
    needs: Artifact-Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: office-addin-dist
          path: dist

      - name: Deploy /dist to VPS
        env:
          SSH_PRIVATE_KEY: ${{secrets.DEPLOY_SSH_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.DEPLOY_KNOWN_HOSTS}}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add - > /dev/null

          rsync -rltz --delete --delay-updates \
            --chmod=D755,F644 \
            --exclude='.well-known/' \
            -e "ssh -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:"